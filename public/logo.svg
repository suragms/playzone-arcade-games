<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>

    <!-- Glowing Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Controller Body Gradient -->
    <linearGradient id="controllerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Button Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)" />

  <!-- Game Controller Body -->
  <path d="M 140 180 
           C 180 170, 332 170, 372 180 
           C 420 190, 440 250, 420 330 
           C 405 390, 360 380, 325 320 
           C 300 275, 212 275, 187 320 
           C 152 380, 107 390, 92 330 
           C 72 250, 92 190, 140 180 Z" 
        fill="url(#controllerGrad)" />

  <!-- D-Pad Left -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="156" y="222" width="16" height="44" rx="4" />
    <rect x="142" y="236" width="44" height="16" rx="4" />
  </g>

  <!-- Action Buttons Right -->
  <circle cx="340" cy="225" r="10" fill="#f43f5e" /> <!-- Top Y -->
  <circle cx="360" cy="245" r="10" fill="#38bdf8" /> <!-- Right X -->
  <circle cx="340" cy="265" r="10" fill="#22c55e" /> <!-- Bottom A -->
  <circle cx="320" cy="245" r="10" fill="#eab308" /> <!-- Left B -->

  <!-- Center Play / Mode Button -->
  <circle cx="256" cy="225" r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="3" />
  <polygon points="253,217 265,225 253,233" fill="#38bdf8" />
</svg>
